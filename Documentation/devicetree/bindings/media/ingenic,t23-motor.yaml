%YAML 1.2
---
$id: http://devicetree.org/schemas/media/ingenic,t23-motor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic T23 GPIO Unipolar Stepper Pan/Tilt Camera Motor

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

properties:
  compatible:
    const: ingenic,t23-motor

  pan-gpios:
    minItems: 4
    maxItems: 4
    description: Four unipolar phase GPIOs driving the pan stepper motor.

  tilt-gpios:
    minItems: 4
    maxItems: 4
    description: Four unipolar phase GPIOs driving the tilt stepper motor.

  switch-gpios:
    maxItems: 1
    description:
      Optional output multiplexer GPIO that switches a shared 4-wire coil
      driver between the pan and tilt motor windings.

  ingenic,pan-max-steps:
    description: Maximum travel range of the pan axis in motor steps.
    $ref: /schemas/types.yaml#/definitions/uint32

  ingenic,tilt-max-steps:
    description: Maximum travel range of the tilt axis in motor steps.
    $ref: /schemas/types.yaml#/definitions/uint32

  ingenic,pan-max-degrees:
    description: Angular range of the pan axis corresponding to pan-max-steps.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 360
    default: 355

  ingenic,tilt-max-degrees:
    description: Angular range of the tilt axis corresponding to tilt-max-steps.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 360
    default: 90

  ingenic,pan-reset-steps:
    description: Homing step count driven along the pan axis during reset.
    $ref: /schemas/types.yaml#/definitions/uint32

  ingenic,tilt-reset-steps:
    description: Homing step count driven along the tilt axis during reset.
    $ref: /schemas/types.yaml#/definitions/uint32

  ingenic,tilt-step-div:
    description: Timer divider applied to tilt step pulses relative to pan.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 64
    default: 1

required:
  - compatible
  - pan-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    motor {
        compatible = "ingenic,t23-motor";
        pan-gpios = <&gpb 22 GPIO_ACTIVE_HIGH>,
                    <&gpb 21 GPIO_ACTIVE_HIGH>,
                    <&gpb 20 GPIO_ACTIVE_HIGH>,
                    <&gpb 19 GPIO_ACTIVE_HIGH>;
        switch-gpios = <&gpa 17 GPIO_ACTIVE_HIGH>;
    };
