%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/soi,jxf23.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Optronics JXF23, JXF37PA, JXF38P and JXH63P image sensors

maintainers:
  - Difan Zhang <alex@osqdu.org>

properties:
  compatible:
    enum:
      - soi,jxf23
      - soi,jxf37pa
      - soi,jxf38p
      - soi,jxh63p

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: xvclk

  avdd-supply:
    description: Analog supply.

  dovdd-supply:
    description: I/O supply.

  dvdd-supply:
    description: Digital core supply.

  reset-gpios:
    maxItems: 1

  pwdn-gpios:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            items:
              - const: 1
              - const: 2

          link-frequencies:
            maxItems: 1
            items:
              enum: [150000000, 216000000, 400000000, 432000000]

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

allOf:
  - if:
      properties:
        compatible:
          enum:
            - soi,jxf37pa
    then:
      properties:
        port:
          properties:
            endpoint:
              properties:
                data-lanes:
                  minItems: 2
                link-frequencies:
                  items:
                    const: 216000000
  - if:
      properties:
        compatible:
          enum:
            - soi,jxf38p
    then:
      properties:
        port:
          properties:
            endpoint:
              properties:
                data-lanes:
                  minItems: 2
                link-frequencies:
                  items:
                    const: 216000000
  - if:
      properties:
        compatible:
          enum:
            - soi,jxh63p
    then:
      properties:
        port:
          properties:
            endpoint:
              properties:
                data-lanes:
                  maxItems: 1
                link-frequencies:
                  items:
                    const: 432000000
  - if:
      properties:
        compatible:
          enum:
            - soi,jxf23
    then:
      properties:
        port:
          properties:
            endpoint:
              properties:
                data-lanes:
                  minItems: 2
                link-frequencies:
                  items:
                    enum: [150000000, 400000000]

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - port

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@40 {
            compatible = "soi,jxf23";
            reg = <0x40>;
            clocks = <&sensor_clk>;
            clock-names = "xvclk";

            port {
                endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <400000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
