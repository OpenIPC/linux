%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/galaxycore,gc2053.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaxyCore GC2053 2MP 1080p MIPI CSI-2 Raw Bayer Image Sensor

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

properties:
  compatible:
    const: galaxycore,gc2053

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: xvclk

  avdd-supply:
    description: Analog 2.8V power supply regulator.

  dovdd-supply:
    description: Digital I/O 1.8V power supply regulator.

  dvdd-supply:
    description: Digital core 1.2V power supply regulator.

  reset-gpios:
    maxItems: 1

  pwdn-gpios:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

          link-frequencies:
            maxItems: 1
            items:
              const: 297000000

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@37 {
            compatible = "galaxycore,gc2053";
            reg = <0x37>;
            clocks = <&sensor_clk>;
            clock-names = "xvclk";

            port {
                gc2053_out: endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <297000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
