%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/smartsens,sc2336.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartSens SC1A4T, SC2336, SC2336P and SC2337P 2MP MIPI CSI-2 Sensors

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

properties:
  compatible:
    enum:
      - smartsens,sc1a4t
      - smartsens,sc2336
      - smartsens,sc2336p
      - smartsens,sc2337p

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: xvclk

  avdd-supply:
    description: Analog 2.8V power supply regulator.

  dovdd-supply:
    description: Digital I/O 1.8V power supply regulator.

  dvdd-supply:
    description: Digital core 1.2V power supply regulator.

  reset-gpios:
    maxItems: 1

  pwdn-gpios:
    maxItems: 1

  smartsens,frame-sync-slave:
    type: boolean
    description:
      Configure the sensor in external frame-synchronization slave mode for
      dual-sensor lockstep capture.

  smartsens,secondary-i2c-addr:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0x08
    maximum: 0x77
    description:
      Remap a paired secondary sensor on the shared reset line to this 7-bit
      I2C address during primary sensor probe before releasing pwdn-gpios.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 2
            items:
              - const: 1
              - const: 2

          link-frequencies:
            maxItems: 1
            items:
              enum:
                - 198000000
                - 360000000

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: smartsens,sc1a4t
    then:
      properties:
        port:
          properties:
            endpoint:
              properties:
                data-lanes:
                  maxItems: 1
                link-frequencies:
                  items:
                    const: 360000000
    else:
      properties:
        port:
          properties:
            endpoint:
              properties:
                data-lanes:
                  minItems: 2
                link-frequencies:
                  items:
                    const: 198000000

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@30 {
            compatible = "smartsens,sc2336";
            reg = <0x30>;
            clocks = <&sensor_clk>;
            clock-names = "xvclk";

            port {
                sc2336_out: endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <198000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
