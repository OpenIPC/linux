%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/hisilicon,hi3520dv100-sata-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3520D V100 SATA PHY

maintainers:
  - Dylan Corrales <deathcamel58@gmail.com>

description:
  The SATA PHY of the HiSilicon AHCI controller, here of the Hi3520D V100. It
  is configured through registers inside the register window of the AHCI
  controller (PHY control, OOB control and the per-port FIFOTH and PHYCTL
  registers) and through options of the system controller, and has a reset
  bit of its own in the SATA clock and reset register of the CRG. One node
  provides one PHY per port, selected by the port number; the number of ports
  is the size of the "ports" window divided by 0x80. The ports share the PHY
  reset and the PHY and OOB control registers. An AHCI node references the
  PHY of a port from its sata-port@N sub-node. The compatible is named after
  the silicon revision.

  The clock select bits of the SATA register of the CRG (150 MHz or 50 MHz
  clock, internal or cko_alive alive clock) are clock muxes of the CRG clock
  driver; the AHCI node selects the parent of each mux with assigned-clocks
  and assigned-clock-parents. The controller, TX, RX and alive resets of the
  same register must be released before the PHY is initialized, which the
  AHCI node does with its resets property; the PHY node only has its own
  reset.

  The PHY control register of every port holds the transmit boost, transmit
  attenuation and receive equalization codes, which the optional properties
  hisilicon,tx-boost, hisilicon,tx-atten and hisilicon,rx-eq give per port as
  raw hardware codes. The data sheet values 0x0e262709 (1.5 Gbit/s) and
  0x0e662709 (3 Gbit/s) have tx-boost 9, tx-atten 0 and rx-eq 0. The generic
  tx-p2p-microvolt of phy-common-props is not used because the codes have no
  documented voltage mapping.

properties:
  compatible:
    const: hisilicon,hi3520dv100-sata-phy

  reg:
    items:
      - description: Global PHY control registers (SATA_TM to SATA_OOB_CTL)
      - description:
          Per-port register blocks, 0x80 bytes per port starting at the first
          port

  reg-names:
    items:
      - const: ctrl
      - const: ports

  '#phy-cells':
    const: 1
    description: Port number, 0 to the number of ports minus 1

  resets:
    items:
      - description: PHY reset (PERI_CRG45 bit 0)

  hisilicon,sysctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      System controller (syscon) with the SATA PHY options, PERIPHCTRL25 (bit 2
      powers the PHY down, bits 21 and 20 select test modes) and PERIPHCTRL3
      (bits 9:0, reference clock offset and spread spectrum select).

  hisilicon,tx-boost:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 2
    items:
      minimum: 0
      maximum: 15
    description:
      Transmit boost code (PHY control register TX_BOOST, bits 3:0), one entry
      for every port or a single entry for all ports. The data sheet gives the
      boost as -20 log [1 - (code + 0.5) / 32] dB; this is the data sheet
      formula, not a measurement. The vendor reference value is 6.

  hisilicon,tx-atten:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 2
    items:
      minimum: 0
      maximum: 4
    description:
      Transmit attenuation code (PHY control register TX_ATTEN, bits 6:4), one
      entry for every port or a single entry for all ports. The codes 0 to 4
      are the amplitude ratios 16/16, 14/16, 12/16, 10/16 and 9/16; code 5 is
      reserved in the register description and not allowed. The vendor reference
      value is 0.

  hisilicon,rx-eq:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 2
    items:
      minimum: 0
      maximum: 7
    description:
      Receive equalization code (PHY control register RX_EQ_VAL, bits 16:14),
      one entry for every port or a single entry for all ports. The data sheet
      gives about (code + 1) x 0.5 dB; this is the data sheet formula, not a
      measurement. The vendor reference value is 5.

required:
  - compatible
  - reg
  - reg-names
  - '#phy-cells'
  - resets
  - hisilicon,sysctrl

additionalProperties: false

examples:
  - |
    phy@10080050 {
        compatible = "hisilicon,hi3520dv100-sata-phy";
        reg = <0x10080050 0x20>, <0x10080100 0x100>;
        reg-names = "ctrl", "ports";
        #phy-cells = <1>;
        resets = <&crg 0xb4 0>;
        hisilicon,sysctrl = <&sysctrl>;
        hisilicon,tx-boost = <9>;
        hisilicon,tx-atten = <0>;
        hisilicon,rx-eq = <0>;
    };
