%YAML 1.2
---
$id: http://devicetree.org/schemas/cache/hisilicon,hi3520dv200-l2cache.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3520DV200 L2 cache controller (hil2v200)

maintainers:
  - Bjorn Stout <bjorn.stout@hotmail.com>

description:
  HiSilicon's own outer cache controller in the Hi3520DV200, 128 KB with
  8 ways and 32-byte lines. It is not an ARM PL310 (its ID register reads 0)
  and is maintained by address, by way and set, or a whole way at a time.

allOf:
  - $ref: /schemas/cache-controller.yaml#

properties:
  compatible:
    const: hisilicon,hi3520dv200-l2cache

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: check 0 (error) interrupt
      - description: check 1 (error) interrupt
      - description: combined interrupt

  cache-unified: true

  cache-level:
    const: 2

required:
  - compatible
  - reg
  - cache-unified
  - cache-level

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    cache-controller@20700000 {
        compatible = "hisilicon,hi3520dv200-l2cache";
        reg = <0x20700000 0x10000>;
        interrupts = <GIC_SPI 29 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 30 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 31 IRQ_TYPE_LEVEL_HIGH>;
        cache-unified;
        cache-level = <2>;
    };
