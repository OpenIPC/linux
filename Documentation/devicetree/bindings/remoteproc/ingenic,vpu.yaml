%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/ingenic,vpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic Video Processing Unit

description:
  Inside the Video Processing Unit (VPU) of the recent JZ47xx SoCs from
  Ingenic is a second Xburst MIPS CPU very similar to the main core.
  This document describes the devicetree bindings for this auxiliary
  processor.

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

properties:
  compatible:
    oneOf:
      - enum:
          - ingenic,jz4770-vpu-rproc
          - ingenic,t23-coprocessor
          - ingenic,t23-riscv
      - items:
          - const: ingenic,t23-coprocessor
          - const: ingenic,t23-riscv

  reg:
    minItems: 2
    maxItems: 4

  reg-names:
    minItems: 2
    maxItems: 4

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    maxItems: 2

  ingenic,cpm:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the CPM syscon node.

  interrupts:
    maxItems: 1

  interrupt-names:
    const: doorbell

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Default firmware image name.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - ingenic,t23-coprocessor
              - ingenic,t23-riscv
    then:
      properties:
        reg:
          items:
            - description: aux registers
            - description: tcsm shared memory
        reg-names:
          items:
            - const: aux
            - const: tcsm
        clocks:
          maxItems: 1
        clock-names:
          const: coproc
    else:
      properties:
        reg:
          items:
            - description: aux registers
            - description: tcsm0 registers
            - description: tcsm1 registers
            - description: sram registers
        reg-names:
          items:
            - const: aux
            - const: tcsm0
            - const: tcsm1
            - const: sram
        clocks:
          items:
            - description: aux clock
            - description: vpu clock
        clock-names:
          items:
            - const: aux
            - const: vpu
        ingenic,cpm: false
        interrupt-names: false
        firmware-name: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,jz4770-cgu.h>

    vpu: video-decoder@132a0000 {
      compatible = "ingenic,jz4770-vpu-rproc";

      reg = <0x132a0000 0x20>, /* AUX */
            <0x132b0000 0x4000>, /* TCSM0 */
            <0x132c0000 0xc000>, /* TCSM1 */
            <0x132f0000 0x7000>; /* SRAM */
      reg-names = "aux", "tcsm0", "tcsm1", "sram";

      clocks = <&cgu JZ4770_CLK_AUX>, <&cgu JZ4770_CLK_VPU>;
      clock-names = "aux", "vpu";

      interrupt-parent = <&cpuintc>;
      interrupts = <3>;
    };
