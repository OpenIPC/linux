%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/hisilicon,hi3536dv100-misc-ctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3536D V100 MISC_CTRL block

maintainers:
  - Dylan Corrales <deathcamel58@gmail.com>

description: |
  The miscellaneous control registers (MISC_CTRL, base 0x12120000, a 64 KiB
  window) of the Hi3536D V100 and the Hi3536E: the USB 2.0 control words, the
  USB 2.0 PHY port registers (offset 0x8000), the SATA and FE PHY controls and
  the DDR master priorities. A plain syscon regmap; the USB 2.0 PHY node is a
  child and reaches the control words and its port registers through it. The
  clock and reset generator and the system controller are different blocks
  with their own bindings.

properties:
  compatible:
    items:
      - const: hisilicon,hi3536dv100-misc-ctrl
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  usb-phy:
    $ref: /schemas/phy/hisilicon,hi3536dv100-usb2-phy.yaml#
    description: On-chip USB 2.0 PHY

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/hi3536dv100-clock.h>

    syscon@12120000 {
        compatible = "hisilicon,hi3536dv100-misc-ctrl", "syscon", "simple-mfd";
        reg = <0x12120000 0x10000>;

        usb-phy {
            compatible = "hisilicon,hi3536dv100-usb2-phy";
            #phy-cells = <0>;
            clocks = <&crg HI3536DV100_USB2_PHY_CLK>,
                     <&crg HI3536DV100_USB2_BUS_CLK>,
                     <&crg HI3536DV100_USB2_OHCI48M_CLK>,
                     <&crg HI3536DV100_USB2_OHCI12M_CLK>,
                     <&crg HI3536DV100_USB2_HST_PHY_CLK>,
                     <&crg HI3536DV100_USB2_UTMI0_CLK>,
                     <&crg HI3536DV100_USB2_UTMI1_CLK>;
            clock-names = "ref", "bus", "ohci48m", "ohci12m", "hst-phy",
                          "utmi0", "utmi1";
            resets = <&crg 0xb8 12>, <&crg 0xb8 13>, <&crg 0xb8 14>,
                     <&crg 0xb8 16>, <&crg 0xbc 1>, <&crg 0xbc 2>,
                     <&crg 0xbc 3>, <&crg 0xbc 4>;
            reset-names = "bus", "utmi0", "utmi1", "hst-phy", "phy",
                          "port0-treq", "port1-treq", "test";
        };
    };
