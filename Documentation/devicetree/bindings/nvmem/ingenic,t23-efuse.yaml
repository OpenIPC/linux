%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/ingenic,t23-efuse.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic T23 SoC eFuse NVMEM

maintainers:
  - Difan Zhang <alex@osqdu.org>

description:
  Direct memory-mapped read-only eFuse OTP window on Ingenic T23 SoCs,
  gated by the CPM eFuse clock.

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    const: ingenic,t23-efuse

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: efuse

required:
  - compatible
  - reg
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,t23-cgu.h>

    efuse@13540200 {
        compatible = "ingenic,t23-efuse";
        reg = <0x13540200 0x40>;
        clocks = <&cgu CLK_EFUSE>;
        clock-names = "efuse";
    };
...
