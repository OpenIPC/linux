%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/hisilicon,hisi-spi-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon SPI-bridged real-time clock

maintainers:
  - Dylan Corrales <deathcamel58@gmail.com>

description: |
  Battery-backed RTC of the HiSilicon DVR, NVR and IPC SoCs. The counter (a
  100 Hz tick counter with a 16-bit day count) and its alarm comparator live
  in a separate power domain. The CPU reaches them through a small SPI master
  in the APB register window (SPI_CLK_DIV and SPI_RW registers). The bridge
  clock is the APB clock divided by 2 * (SPI_CLK_DIV + 1), and the data sheets
  limit it to 12 MHz or 5 MHz depending on the SoC.

  The APB side is the same on all SoCs. The register map behind the bridge
  and a few timing rules come in editions:

    V1: counter registers always readable, no wait around the load, crystal
        temperature compensation registers. Hi3520D V100 (also Hi3515A and
        Hi3515C), Hi3518A/C V100, Hi3518E V100, Hi3516C V100.
    V1 with lock: V1 with a counter lock request and a 5 ms wait between
        writing the load value and starting the load. Hi3516A V100 and
        Hi3516D V100 (one data sheet).
    V2: counter lock request, no temperature compensation registers. Hi3518E
        V200 and Hi3516C V200.
    V3: V2 with a battery under-voltage interrupt behind a global interrupt
        enable, and a 5 MHz limit of the bridge clock. Hi3516A V200,
        Hi3516A V300, Hi3516C V300, Hi3516E V100, Hi3519 V101, Hi3536D V100.

  The alarm interrupt line is shared with another source on some SoCs: VIC
  line 2 with the debug UART interrupt (COMMRX) on Hi3518, Hi3518E V100 and
  Hi3516C V100, where a system controller bit (PERI_CTRL0 bit 31) selects the
  source, and with the temperature capture interrupt on Hi3518E V200,
  Hi3516C V200, Hi3516A V200 and Hi3519 V101. Routing the line to the RTC is
  part of the board setup and is not done by the RTC driver. If another
  handler of the line is not compatible with a shared, oneshot threaded
  handler, the driver registers the clock without the alarm and without
  wakeup instead of failing. This works only when the RTC probes after the
  other source: an RTC that gets the line first takes it with a shared,
  oneshot handler, and the other source needs the same to share it.

  The data sheets describe no crystal, oscillator or battery selection that a
  board has to choose, so the node has no properties for them. The crystal
  frequency is nominally 32.768 kHz (the reset value of Sdm_coef, which
  accepts 32700 to 32800 Hz), and a missing crystal or supply shows as a
  counter that does not run, which the driver reports.

  The driver programs the bridge divider, the counter lock mode, the
  interrupt registers, the test clock output select, the match value and,
  on the editions that have it, TEMP_SEL (temperature compensation mode),
  which it sets to its reset value 0 (compensation on, internal sensor). The
  other modes of TEMP_SEL switch the compensation off or take the temperature
  from a register that nothing feeds. The correction table (LUT1 to LUT47),
  TOT_OFFSET, TEMP_OFFSET and Sdm_coef are left alone: they trim the
  crystal, the reset values suit a typical one and the battery powered
  domain is the only place the calibration of a board can live in. A
  property for a different crystal frequency can be added when a board needs
  one. The sensor and low-voltage sample periods (RTC_SAR_CTRL on V1,
  RTC_UV_CTRL on V3), RTC_ANA_CTRL (bias current of the analog start-up
  circuit, Hi3516A V100 and Hi3516D V100) and the user registers are not
  needed for timekeeping and are left alone as well.

allOf:
  - $ref: rtc.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - hisilicon,hi3516cv100-rtc
              - hisilicon,hi3518ev100-rtc
              - hisilicon,hi3518v100-rtc
              - hisilicon,hi3520dv100-rtc
          - const: hisilicon,hisi-spi-rtc-v1
      - items:
          - enum:
              - hisilicon,hi3516cv200-rtc
              - hisilicon,hi3518ev200-rtc
          - const: hisilicon,hisi-spi-rtc-v2
      - items:
          - enum:
              - hisilicon,hi3516av200-rtc
              - hisilicon,hi3516av300-rtc
              - hisilicon,hi3516cv300-rtc
              - hisilicon,hi3516ev100-rtc
              - hisilicon,hi3519v101-rtc
              - hisilicon,hi3536dv100-rtc
          - const: hisilicon,hisi-spi-rtc-v3
      - items:
          - enum:
              - hisilicon,hi3516av100-rtc
              - hisilicon,hi3516dv100-rtc
          - const: hisilicon,hisi-spi-rtc-v1-lock

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description:
      Alarm (counter match) interrupt. Without it the alarm is not available.
      The line may be shared with another interrupt source.

  clocks:
    maxItems: 1
    description:
      APB bus clock, the reference of the SPI bridge clock divider.

  wakeup-source: true

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/hi3520dv100-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    rtc@20060000 {
        compatible = "hisilicon,hi3520dv100-rtc", "hisilicon,hisi-spi-rtc-v1";
        reg = <0x20060000 0x1000>;
        interrupts = <GIC_SPI 7 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crg HI3520DV100_APB_CLK>;
        wakeup-source;
    };
