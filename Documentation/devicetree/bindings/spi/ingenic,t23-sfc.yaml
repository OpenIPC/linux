%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/ingenic,t23-sfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic T-Series SFC v1 SPI Flash Controller

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    enum:
      - ingenic,t23-sfc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: SFC divider clock
      - description: SFC AHB gate clock

  clock-names:
    items:
      - const: sfc
      - const: gate

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,t23-cgu.h>
    spi@13440000 {
      compatible = "ingenic,t23-sfc";
      reg = <0x13440000 0x10000>;
      interrupt-parent = <&intc>;
      interrupts = <7>;
      clocks = <&cgu CLK_CGU_SFC>, <&cgu CLK_SFC>;
      clock-names = "sfc", "gate";
      #address-cells = <1>;
      #size-cells = <0>;

      flash@0 {
        compatible = "jedec,spi-nor";
        reg = <0>;
        label = "jz_sfc";
        spi-max-frequency = <50000000>;
      };
    };
