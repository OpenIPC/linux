%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/hisilicon,hi3520dv200-sfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3520DV200 SPI flash controller (SFC v350)

maintainers:
  - Bjorn Stout <bjorn.stout@hotmail.com>

description:
  The SPI-NOR controller of the Hi3520DV200 (hardware version 0x350), with
  the register layout of the v3xx controllers handled by spi-hisi-sfc-v3xx.
  Without an interrupt the driver polls for completion.

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: hisilicon,hi3520dv200-sfc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  num-cs:
    description:
      Number of chip selects. The flash on Hi3520DV200 boards is on CS1.
    maximum: 2
    default: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    spi@10010000 {
        compatible = "hisilicon,hi3520dv200-sfc";
        reg = <0x10010000 0x1000>;
        num-cs = <2>;
        #address-cells = <1>;
        #size-cells = <0>;

        flash@1 {
            compatible = "jedec,spi-nor";
            reg = <1>;
            label = "hi_sfc";
            spi-max-frequency = <50000000>;
        };
    };
