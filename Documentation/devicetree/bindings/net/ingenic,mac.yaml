%YAML 1.2
---
$id: http://devicetree.org/schemas/net/ingenic,mac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MAC in Ingenic SoCs

maintainers:
  - 周琰杰 (Zhou Yanjie) <zhouyanjie@wanyeetech.com>

description:
  The Ethernet Media Access Controller in Ingenic SoCs.

select:
  properties:
    compatible:
      contains:
        enum:
          - ingenic,jz4775-mac
          - ingenic,x1000-mac
          - ingenic,x1600-mac
          - ingenic,x1830-mac
          - ingenic,t23-mac
          - ingenic,x2000-mac
  required:
    - compatible

allOf:
  - $ref: snps,dwmac.yaml#
  - if:
      not:
        properties:
          compatible:
            contains:
              const: ingenic,t23-mac
    then:
      properties:
        clocks:
          maxItems: 1
        clock-names:
          const: stmmaceth

properties:
  compatible:
    oneOf:
      - enum:
          - ingenic,jz4775-mac
          - ingenic,x1000-mac
          - ingenic,x1600-mac
          - ingenic,x1830-mac
          - ingenic,t23-mac
          - ingenic,x2000-mac
      - items:
          - const: ingenic,t23-mac
          - const: snps,dwmac

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: macirq

  clocks:
    minItems: 1
    items:
      - description: GMAC main clock
      - description: MAC PHY clock

  clock-names:
    minItems: 1
    items:
      - const: stmmaceth
      - const: macphy

  mode-reg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: An extra syscon register that control ethernet interface and timing delay

  rx-clk-delay-ps:
    description: RGMII receive clock delay defined in pico seconds

  tx-clk-delay-ps:
    description: RGMII transmit clock delay defined in pico seconds

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - mode-reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,x1000-cgu.h>

    mac: ethernet@134b0000 {
        compatible = "ingenic,x1000-mac";
        reg = <0x134b0000 0x2000>;

        interrupt-parent = <&intc>;
        interrupts = <55>;
        interrupt-names = "macirq";

        clocks = <&cgu X1000_CLK_MAC>;
        clock-names = "stmmaceth";

        mode-reg = <&mac_phy_ctrl>;
        phy-mode = "rmii";
    };
...
