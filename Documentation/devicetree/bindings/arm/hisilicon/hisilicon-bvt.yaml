%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/hisilicon/hisilicon-bvt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon BVT IP Camera SoC Platforms

maintainers:
  - Dmitry Ilyin <6576495+widgetii@users.noreply.github.com>

description: |
  HiSilicon BVT (Broadcast Video Technology) SoC family: ARM Cortex-A7
  processors, and the earlier ARM926EJ-S Hi3516C V200 and Hi3518E V20X
  parts, used in IP cameras and video surveillance equipment.

  hisilicon,hi3518ev200 is the ARM926EJ-S Hi3518E V200, which the
  hisilicon,hi3518ev20x name predates and replaces; the latter names no chip
  and is deprecated.

properties:
  $nodename:
    const: /
  compatible:
    oneOf:
      - items:
          - const: hisilicon,hi3516ev200
      - items:
          - const: hisilicon,hi3516ev300
      - items:
          - const: hisilicon,hi3516cv200
      - items:
          - const: hisilicon,hi3518ev200
      - items:
          - const: hisilicon,hi3518ev20x
        deprecated: true
      - items:
          - const: hisilicon,hi3518ev300
      - items:
          - const: hisilicon,hi3516dv200
      - items:
          - const: hisilicon,hi3516dv300
      - items:
          - const: hisilicon,hi3536dv100

additionalProperties: true
